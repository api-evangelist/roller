summary: >-
  ROLLER documents webhooks for real-time, event-driven integrations —
  subscribe to key events so external systems stay in sync without polling.
  Webhook subscriptions are managed through the REST API (view/create/manage
  webhooks). The full machine-readable event catalog is served from the
  Stoplight-hosted Developer Center and requires the live docs to enumerate;
  individual event topics were not extractable at enrichment time and are not
  fabricated here.
