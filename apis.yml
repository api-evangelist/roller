aid: roller
name: ROLLER
description: >-
  ROLLER is a cloud-based venue management platform for the attractions and
  leisure industry — trampoline parks, family entertainment centers, museums,
  zoos, aquariums, water parks and amusement venues. It unifies ticketing and
  online bookings, point of sale, memberships and passes, digital waivers,
  integrated payments, a CRM and guest experience score, self-serve kiosks and
  gift cards in a single system. ROLLER exposes two public APIs — a real-time
  REST API for products, sessions, availability and bookings, and a Reporting
  (Data) API for extracting venue data to external warehouses and BI tools —
  plus webhooks for event-driven integrations and OCTO API compatibility for
  channel/distribution partners. API access is an add-on to a ROLLER
  subscription and is authenticated with OAuth2 client credentials.
