  - Payments
  properties:
  - type: APIReference
    url: https://docs.roller.app/docs/rest-api/fd3c345161c6c-rest-api-specification
  - type: Authentication
    url: authentication/roller-authentication.yml
  - type: Webhooks
    url: asyncapi/roller-webhooks.yml
- name: ROLLER Reporting API
  description: >-
    Read-only Data/Reporting API that gives venues a mechanism to extract a
    copy of their ROLLER data and syndicate it to an external database, data
    warehouse or BI/analytics platform. Designed for periodic (hourly/daily)
    extraction, not real-time use cases, and cannot write data to ROLLER.
  humanURL: https://docs.roller.app/docs/api/reporting
  baseURL: https://api.roller.app
  tags:
  - Reporting
  - Analytics
  - Data Warehouse
