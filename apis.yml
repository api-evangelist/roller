apis:
- name: ROLLER REST API
  description: >-
    General-purpose real-time REST API for the ROLLER platform. Retrieve
    products, sessions and availability, and create and manage real-time
    bookings to power external checkout and booking journeys. Authenticated
    with OAuth2 client credentials; limited to one request per second per
    credential set.
  humanURL: https://docs.roller.app/docs/api/rest
  baseURL: https://api.roller.app
  tags:
  - Bookings
  - Product
  - Sessions
  - Availability
  - Payments
  tags_raw:
